  <style>
    @font-face {
      font-family: montrealbook;
      font-display: swap;
      src: url(assets/fonts/NeueMontreal-Regular.woff2) format("woff2"),
           url(assets/fonts/NeueMontreal-Regular.woff) format("woff");
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 10px; }
    body {
      font-family: 'Courier Prime', 'Courier New', monospace;
      background: #FFFFFF;
      color: #1C1C1E;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── CADRE EXTÉRIEUR ── */
    .frame {
      margin: 12px;
      min-height: calc(100vh - 24px);
      border: 1px solid #1C1C1E;
      display: grid;
      grid-template-columns: 210px 1fr;
      grid-template-rows: auto 1fr auto;
    }

    /* ── BARRE DU HAUT ── */
    .top-bar {
      grid-column: 1 / 3;
      grid-row: 1;
      border-bottom: 1px solid #1C1C1E;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 20px;
    }
    .top-bar-label {
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #1C1C1E;
    }
    .top-nav {
      display: flex;
      gap: 3.2rem;
    }
    .top-link {
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-decoration: none;
      color: #1C1C1E;
      transition: opacity 0.15s;
    }
    .top-link:hover { opacity: 0.45; }
    .top-link.active { color: #1C1C1E; }

    /* ── COLONNE GAUCHE ── */
    .col-left {
      grid-column: 1;
      grid-row: 2;
      border-right: 1px solid #1C1C1E;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }
    .photo img {
      display: block;
      width: 100%;
      height: auto;
    }
    .left-name {
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      line-height: 1.35;
      color: #1C1C1E;
      flex-shrink: 0;
    }

    /* ── COLONNE DROITE ── */
    .col-right {
      grid-column: 2;
      grid-row: 2;
      padding: 28px 44px 40px;
    }

    .right-header { margin-bottom: 2.8rem; }
    .right-name {
      font-size: 1.25rem;
      letter-spacing: 0.03em;
      margin-bottom: 0.3rem;
    }
    .right-role {
      font-size: 1.2rem;
      color: rgba(28,28,30,0.45);
      margin-bottom: 0.3rem;
    }
    .right-contact {
      font-size: 1.2rem;
      color: rgba(28,28,30,0.45);
    }
    .right-contact a {
      color: inherit;
      text-decoration: none;
    }
    .right-contact a:hover { text-decoration: underline; }
